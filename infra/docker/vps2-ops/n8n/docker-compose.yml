# n8n — orquestador de workflows (ADR-0005)
#
# Sirve flow.livskin.site (vía nginx-vps2 con TLS).
# Webhooks recibidos: SureForms POST, WhatsApp Cloud API.
#
# Backend DB: Postgres (postgres-analytics, DB 'n8n') desde Sprint 1.2 2026-05-28.
# Antes era SQLite local — migrado para soportar concurrencia + replica.
# Backup SQLite original: /home/livskin/apps/n8n/data.sqlite-bak-20260602
#
# Volumen: ./data/ contiene SOLO config (encryption key). DB en Postgres.
#
# Env vars secretas: vienen de ./.env (gitignored).
# Variables DB_POSTGRESDB_* + N8N_ENCRYPTION_KEY críticos para PG backend.
# Ver infra/n8n/conventions.md § 9 para política de credenciales.

services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: always

    # env_file: secretos sensibles (Vtiger access key, ERP audit token, etc.)
    # Estructura del archivo en .env.example
    env_file:
      - .env

    environment:
      # n8n-specific (con defaults)
      - N8N_HOST=${N8N_HOST:-flow.livskin.site}
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=${N8N_WEBHOOK_URL:-https://flow.livskin.site}
      # Habilitar autenticación basic en futuro:
      # - N8N_BASIC_AUTH_ACTIVE=true
      # - N8N_BASIC_AUTH_USER=${N8N_BASIC_USER}
      # - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_PASS}

    volumes:
      - ./data:/home/node/.n8n

    networks:
      - revops_net

networks:
  revops_net:
    external: true
