# Redis 7 configuration — VPS2 Livskin RevOps
# Sprint 1.1 (2026-05-28)

# Binding
bind 0.0.0.0
port 6379
protected-mode yes

# Memory
maxmemory 200mb
maxmemory-policy allkeys-lru

# Persistencia: AOF para durabilidad locks + queues
appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# RDB snapshots backup (cada 5min si 100+ keys cambiaron, etc.)
save 900 1
save 300 10
save 60 10000

# Logging
loglevel notice
logfile ""

# Slow log
slowlog-log-slower-than 10000
slowlog-max-len 128

# Client limits
maxclients 1000
timeout 0
tcp-keepalive 300

# Security: requirepass se setea via --requirepass CLI arg en compose
